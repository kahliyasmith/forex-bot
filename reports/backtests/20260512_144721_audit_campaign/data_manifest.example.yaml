      required_before_backtest: true
      validator_command: "python scripts/validate_market_data.py --data data/historical/USD_JPY_H1_ohlcv_mid_2020_2025.csv --data-kind candles --expected-interval-minutes 60 --output-dir reports/data_validation/USD_JPY_H1"
