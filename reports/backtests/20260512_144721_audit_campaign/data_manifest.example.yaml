# Example only. The current runners do not consume this manifest directly yet.
# Use scripts with explicit --data paths until manifest loading is implemented.

symbols:
  EUR_USD:
    source: "broker_or_vendor_name"
    broker_or_venue: "same_as_intended_execution_broker_if_possible"
    data_type: "tick_bid_ask"
    timeframe: "tick"
    timezone: "UTC"
    path: "data/historical/EUR_USD_tick_bidask_2020_2025.csv"
    start: "2020-01-01"
    end: "2025-12-31"
    columns:
      timestamp: "timestamp"
      pair: "pair"
      bid: "bid"
      ask: "ask"
      bid_size: null
      ask_size: null
    spread_available: true
    commission_model: "documented_in_assumptions.md"
    swap_model: "documented_in_assumptions.md"
    account_currency: "USD"
    expected_interval: null
    validation:
      required_before_backtest: true
      validator_command: "python scripts/validate_market_data.py --data data/historical/EUR_USD_tick_bidask_2020_2025.csv --data-kind quotes --output-dir reports/data_validation/EUR_USD_tick"
    notes: "Preferred audit-grade format."

  GBP_USD:
