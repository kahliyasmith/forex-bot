      pair: "pair"
      bid_open: "bid_open"
      bid_high: "bid_high"
      bid_low: "bid_low"
      bid_close: "bid_close"
      ask_open: "ask_open"
      ask_high: "ask_high"
      ask_low: "ask_low"
      ask_close: "ask_close"
      volume: "volume"
    spread_available: true
    commission_model: "documented_in_assumptions.md"
    swap_model: "documented_in_assumptions.md"
    account_currency: "USD"
    expected_interval: "60m"
    loader_support: "requires_bid_ask_candle_loader_before_current_backtest_runner_can_use_this_format"
    validation:
      required_before_backtest: true
      validator_command: null
    notes: "Preferred data shape, but current scripts need a loader adapter before this exact format can be backtested or validated by the simple CSV validator."

  USD_JPY:
